# trade_cooldown.conf — configuration for the anti rapid-fire order gate.
# Text (ini), NOT json. Editable without touching the code; read at import time.
#
# default_sec = the minimum seconds between two orders on the SAME symbol (any
#               combination of BUY/BUY, SELL/SELL, BUY/SELL). Larger = more
#               conservative; smaller = faster reaction. If the file or
#               cheia lipsesc, codul cade pe fallback-ul intern.
[cooldown]
default_sec = 20
