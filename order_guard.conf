# order_guard.conf — pragul MINIM de profit (%) pentru gardul de profit, per venue.
# Citit de order_guard.margin_for(provider). Format:  <provider> = <procent>
# (lowercase names as in provider.name; 'default' = the fallback when the venue is not listed).
# Lipsa fisierului / valoare invalida -> default 1.15 (fail-safe). Modificarea cere
# restart bot (valoarea e cache-uita la prima citire).

default = 1.15
binance = 1.15
kraken  = 1.15

# Fereastra (ore) pt tier-ul min/max time-windowed, per venue: cheia <venue>_window_h.
# On a BUY -> min(sell) in the window; on a SELL -> max(buy). 0 = no tier (only the last
# opposite fill). Binance does NOT use this (it has an internal guard in bapi with its own Order cache,
# pe safeback_seconds = 12-14 zile in practica, trecut per-apel de monitortrades/tradeall).
# 30 iul: kraken_window_h 48h -> 336h (14 zile) — UNIFICAT cu fereastra efectiva Binance
# (cerere user "tot la valoarea mare"). Fereastra mai lunga = referinta de profit mai
# conservatoare (min sell / max buy pe 14 zile, nu 2). Kraken cache e 14 zile INTENTIONAT
# (rate-limit), deci fereastra se potriveste cu datele disponibile. Schimbare reala de
# comportament pe Kraken/HYPE — revenire: pune inapoi 48.
default_window_h = 0
kraken_window_h  = 336

# Proxy de trend pt WEIGHT (gauss) cand symbol-ul n-are trend LUNG propriu (ex HYPEUSD pe
# Kraken pana se calculeaza trendul lui). Foloseste curba gauss a altui symbol (BTC = beta
# of the market). The key is <venue>_weight_proxy or default_weight_proxy. No proxy -> default 0.03.
kraken_weight_proxy = BTCUSDC

# 30 iul: plafon zilnic + anti-spam (echivalentul agnostic al if_place_safe_order din
# Binance) — now shared, through Instrument.place(), for any provider that does NOT guard internally
# (Binance ramane pe propria implementare, mai veche, cu date proprii — vezi
# bapi_placeorder_config.env). Cheia <venue>_xxx sau default_xxx.
# max_daily_trades: plafon tranzactii/zi (raportat la safeback_sec) inainte de refuz "daily_limit".
default_max_daily_trades = 25
# safeback_sec: fereastra (secunde) in care se cauta tranzactii pt plafonul zilnic +
# referinta gardului de profit. 30 iul: 48h -> 14 zile (unificat "tot la valoarea mare",
# ca fereastra efectiva Binance/monitortrades/tradeall).
default_safeback_sec = 1209660   # 14 zile + 60s
# recent_transaction_sec: refuse a new order on the same symbol+side if there was one within
# ultimele atatea secunde (anti-spam, separat de cooldown-ul global pe symbol). 180 = 3 min,
# IDENTIC cu pragul hardcodat istoric in bapi_placeorder.if_place_safe_order.
default_recent_transaction_sec = 180
