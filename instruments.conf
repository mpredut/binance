# ============================================================================
# instruments.conf — REGISTRU CENTRAL de instrumente (provider + symbol + params).
# Nume sectiune = PLATFORMA_SIMBOL (ex [BINANCE_BTC]). Gandit multi-consumator
# (mt.* pt monitortrades, tradeall.*/rtrade.* rezervate pt viitor), dar 23 iul:
# verificat prin grep — azi SINGURUL consumator real e monitortrades.py
# (load_for("mt")). tradeall.py/rtrade.py au propriile *_config.env separate.
#
# CORE:
#   provider      = binance | hyperliquid | kraken | t212
#   symbol        = symbolul NATIV al venue-ului (HYPEUSDC pe HL, HYPEUSD pe Kraken, *_US_EQ pe T212)
#   base / quote  = activul / moneda de cotare (free_balance e pe `base`)
#   enabled       = yes/no
#   isolation     = dedicated | own_ledger (vezi designul; nefolosit inca in bucla)
#   market_hours  = 24x7 | rth (actiuni: doar orele de piata)
#   ownership.account_ref = optional, identificator NESENSIBIL pt inventarul read-only;
#                           useful only if monitortrades uses a different account than the venue bot
# params mt.* = gain%/lost%/maxage_zile + hardtp/hardtp_fraction/hardtp_cooldown_h + ref(last|average)
# ============================================================================

[BINANCE_BTC]
provider     = binance
symbol       = BTCUSDC
base         = BTC
quote        = USDC
enabled      = yes
isolation    = own_ledger
market_hours = 24x7
# BACKTEST: 5.0, 7.0, 8.0, 9.0
mt.gain              = 5.25
# BACKTEST: 2.3, 3.3, 3.8, 4.3
mt.lost              = 2.925
# BACKTEST: 4, 7, 10, 14
mt.maxage_days       = 10.5
# BACKTEST: 12, 17, 20, 24
mt.hardtp            = 17
# BACKTEST: 0.3, 0.5, 0.65, 0.8
mt.hardtp_fraction   = 0.5
mt.hardtp_cooldown_h = 6
mt.ref               = last
# 23 iul: buy_budget/max_budget adaugate dupa backtest pe replay (offline/research/
# monitortrades_backtest/) — WITHOUT them, "buy again" in monitor_price_and_trade
# cumpara qty=1 (1 BTC intreg, ~$65-111k in istoricul testat) fara niciun plafon
# total. buy_budget=250 controleaza marimea per-cumparare (Kraken HYPE are deja
# acelasi tipar); max_budget=3500 = validat pe TAO (net -$45 vs buy&hold -$420,
# all cycles closed correctly) after averaging the value found through the
# backtest (~2000, stable zone 1500-3000) and the proposed value (5000, which
# singura a dat net -$5279 cu 0 vanzari — pozitie ramasa blocata).
mt.buy_budget        = 250
mt.max_budget        = 3500

[BINANCE_TAO]
provider     = binance
symbol       = TAOUSDC
base         = TAO
quote        = USDC
enabled      = yes
isolation    = own_ledger
market_hours = 24x7
# BACKTEST: 7.5, 9.2, 10.5, 12.0
mt.gain              = 9.2
# BACKTEST: 3.9, 4.9, 5.6, 6.3
mt.lost              = 5.25
# BACKTEST: 10, 17, 22, 28
mt.maxage_days       = 17
# BACKTEST: 12, 17, 20, 24
mt.hardtp            = 17
# BACKTEST: 0.3, 0.5, 0.65, 0.8
mt.hardtp_fraction   = 0.5
mt.hardtp_cooldown_h = 6
mt.buy_budget        = 250
mt.max_budget        = 3500
mt.ref               = last

# HYPE pe Hyperliquid SPOT — enabled=no: soldul spot HL e PARTAJAT cu piciorul long al
# DN-bot -> NU activa live pana la izolare (al 2-lea wallet HL).
[HYPERLIQUID_HYPE]
provider     = hyperliquid
symbol       = HYPEUSDC
base         = HYPE
quote        = USDC
enabled      = no
isolation    = own_ledger
market_hours = 24x7
mt.gain              = 9.0
mt.lost              = 5.0
mt.maxage_days       = 17
mt.hardtp            = 17
mt.hardtp_fraction   = 0.5
mt.hardtp_cooldown_h = 6
mt.ref               = last

# HYPE on KRAKEN — Kraken has no DN. Real orders only with KRAKEN_LIVE_ORDERS=true.
# ⚠ free_balance(HYPE) = soldul tau Kraken (inclusiv HYPE manual).
[KRAKEN_HYPE]
provider     = kraken
symbol       = HYPEUSD
base         = HYPE
quote        = USD
enabled      = yes
isolation    = own_ledger
market_hours = 24x7
mt.gain              = 9.0
mt.lost              = 5.0
mt.maxage_days       = 17
mt.hardtp            = 17
mt.hardtp_fraction   = 0.5
mt.hardtp_cooldown_h = 6
# 23 iul: mt.buy_budget/mt.max_budget de mai jos aveau comentarii INLINE (pe
# on the same line as the value) — configparser does NOT strip them by default (only
# comentariile pe linie proprie), deci valoarea parsata era literal string-ul
# "200      # USD per cumparare..." -> float() esua -> cade pe default (None,
# i.e. WITHOUT real protection) ever since this file was written. Fixed by
# mutarea comentariilor pe linii proprii (convenia restului fisierului).
# USD per buy -> qty = budget/price (no longer hardcoded to 1 HYPE)
mt.ref               = last
mt.buy_budget        = 200
# total USD exposure cap (the HYPEUSD quote currency): do not buy if the value
# of the position (avail_qty * price) >= this cap. 30 Jul: 700 -> 5000 (user request;
# the current ~2223 USD position was ~3x over the old 700 cap, so it was blocked).
mt.max_budget        = 5000

# STOCKS REALE pe Trading212 (model portofoliu, RTH). enabled=no: sunt tranzactionate de
# t212_bot (212trading/, STRAT_*). Declared here only as a registry; do NOT set them enabled=yes
